<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Teste de @Media</title>
    

    <!-- Estilos da página -->
    <style>
        *{box-sizing: border-box; margin: 0; padding: 0;}

        body{
            background-color: olivedrab; 
            padding: 20px;
            
            }

        .container{
            width: 100%; 
            display: flex;
            gap: 15px;
            flex-wrap: wrap; 
            justify-content:center}


        h1{text-align: center; margin-bottom: 20px;}

        .box{ 
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;}

        .container-position{margin-top: 10px; width: 100%; height: 600px; border: 2px solid #e06dd7;}

        .filho-tamanho{ position: absolute; width: 200px; height: 200px; background-color: #e06dd7;}
        .container-position__filho01{top: 0; left: 0;}
        .container-position__filho02{top: 0; right: 0;}
        .container-position__filho03{bottom: 0; left: 0;}
        .container-position__filho04{bottom: 0; right: 0;}
        
        @media screen and (min-width: 768px) {
            body {
                background-color: blue;
                color: white;
                }

            .box { max-width: 350px;}
 
        }


        @media screen and (min-width: 992px) {
            body {
                    background-color: tan;
                    color: black;} 
            .box{max-width: 285px;}}

    

    </style>
</head>

<body>
    <h1 >Testes com CSS @Media Query</h1>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>
    </div>
</body>
</html>
